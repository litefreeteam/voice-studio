# Temporary HTTP configuration for the first ACME certificate issuance.
server {
    listen 80;
    server_name voice.freeteam.top freeteam.top;
    root /var/www/shengyue/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
