map $uri $shengyue_cache_control {
    default "public, max-age=3600";
    "~/$" "no-cache";
    "~\.html$" "no-cache";
    /healthz "no-store";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2)$" "public, max-age=31536000, immutable";
}

map $uri $shengyue_robots {
    default "";
    /healthz "noindex";
    "~^/(downloads|docs)/" "noindex";
}

server {
    listen 80;
    server_name voice.freeteam.top freeteam.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://voice.freeteam.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name freeteam.top;
    ssl_certificate /etc/ssl/shengyue/fullchain.pem;
    ssl_certificate_key /etc/ssl/shengyue/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://voice.freeteam.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voice.freeteam.top;
    root /var/www/shengyue/current;
    index index.html;

    ssl_certificate /etc/ssl/shengyue/fullchain.pem;
    ssl_certificate_key /etc/ssl/shengyue/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShengyueTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    # Redirect only explicit requests, not the internal directory-index lookup.
    if ($request_uri ~ "^(.*/)index[.]html([?].*)?$") {
        return 301 https://voice.freeteam.top$1$2;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag $shengyue_robots always;
    add_header Cache-Control $shengyue_cache_control;

    access_log /var/log/nginx/shengyue.access.log;
    error_log /var/log/nginx/shengyue.error.log warn;

    include /etc/shengyue/paypal.locations.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location ^~ /downloads/ {
        alias /var/www/shengyue/shared/downloads/;
        autoindex off;
    }

    # Vite bundles contain a content hash; auditions retain stable filenames.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2)$" {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
